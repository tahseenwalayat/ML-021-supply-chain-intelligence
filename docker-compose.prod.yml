version: '3.8'

services:
  # ============================================================================
  # 1. PostgreSQL Database Service
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: supply_chain_postgres_prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-supply_chain_prod}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_prod_secret}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-supply_chain_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # 2. Redis Cache & Broker Service
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: supply_chain_redis_prod
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_prod_secret}
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-redis_prod_secret} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # 3. MLflow Model Tracking & Artifact Server
  # ============================================================================
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.11.3
    container_name: supply_chain_mlflow_prod
    restart: unless-stopped
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:///mlflow.db --default-artifact-root /mlflow/artifacts
    volumes:
      - mlflow_prod_data:/mlflow
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # 4. FastAPI Backend Service Pool (High Availability - Replicas 1, 2, 3)
  # ============================================================================
  api1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: supply_chain_api_1
    restart: unless-stopped
    environment:
      - APP_NAME=${APP_NAME:-supply-chain-forecasting}
      - ENVIRONMENT=production
      - API_KEY=${API_KEY:?Set API_KEY in .env.prod before production deployment}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-supply_chain_prod}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres_prod_secret}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis_prod_secret}
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - INSTANCE_ID=api1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  api2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: supply_chain_api_2
    restart: unless-stopped
    environment:
      - APP_NAME=${APP_NAME:-supply-chain-forecasting}
      - ENVIRONMENT=production
      - API_KEY=${API_KEY:?Set API_KEY in .env.prod before production deployment}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-supply_chain_prod}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres_prod_secret}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis_prod_secret}
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - INSTANCE_ID=api2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  api3:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: supply_chain_api_3
    restart: unless-stopped
    environment:
      - APP_NAME=${APP_NAME:-supply-chain-forecasting}
      - ENVIRONMENT=production
      - API_KEY=${API_KEY:?Set API_KEY in .env.prod before production deployment}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-supply_chain_prod}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres_prod_secret}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis_prod_secret}
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - INSTANCE_ID=api3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # 5. Streamlit Executive Dashboard Service
  # ============================================================================
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: supply_chain_dashboard_prod
    restart: unless-stopped
    command: ["streamlit", "run", "dashboard/app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    environment:
      - API_BASE_URL=http://nginx:80
      - API_KEY=${API_KEY:?Set API_KEY in .env.prod before production deployment}
    depends_on:
      - api1
      - api2
      - api3
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8501/_stcore/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # 6. NGINX Reverse Proxy & Round-Robin Load Balancer
  # ============================================================================
  nginx:
    image: nginx:1.25-alpine
    container_name: supply_chain_nginx_prod
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api1
      - api2
      - api3
      - dashboard
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_prod_data:
  redis_prod_data:
  mlflow_prod_data:
