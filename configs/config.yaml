# Supply Chain Forecasting Platform Configuration

paths:
  raw_data_dir: "data/raw"
  interim_data_dir: "data/interim"
  processed_data_dir: "data/processed"
  models_dir: "models"
  docs_dir: "docs"
  configs_dir: "configs"

database:
  host: "localhost"
  port: 5432
  name: "supply_chain"
  user: "postgres"
  password: "postgres"
  sqlite_fallback_path: "data/supply_chain.db"

redis:
  host: "localhost"
  port: 6379
  db: 0

model_defaults:
  test_size: 0.2
  random_state: 42
  time_series_horizon_days: 30
  n_estimators: 100
  learning_rate: 0.05

date_range:
  start_date: "2013-01-01"
  end_date: "2018-10-31"

inventory:
  service_level: 0.95
  default_lead_time_days: 7.0
  ordering_cost: 50.0
  holding_cost_rate: 0.20
  holding_cost_fixed: 2.0

risk:
  overstock_rop_multiplier: 3.0
  low_velocity_threshold: 1.0
  slow_moving_zero_sales_weeks: 4
  dead_inventory_zero_sales_weeks: 12
  anomaly_z_score_threshold: 3.0
  supplier_weight_late_rate: 0.6
  supplier_weight_delay_var: 0.4


